name: Data Refresh & Deploy

on:
  # 每周一北京时间 9:00 自动运行 (UTC 1:00)
  schedule:
    - cron: '0 1 * * 1'
  
  # 允许手动触发
  workflow_dispatch:
    inputs:
      force_deploy:
        description: '强制部署（忽略数据变化）'
        required: false
        default: 'false'

  # 也可以在 push 到特定分支时触发
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/data-refresh.yml'

env:
  NODE_VERSION: '20'
  TZ: 'Asia/Shanghai'

jobs:
  data-refresh:
    name: Refresh Data & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      # 步骤1: Checkout 代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 步骤2: 设置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # 步骤3: 安装依赖
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # 步骤4: 运行数据刷新脚本
      - name: Run data refresh script
        id: refresh
        run: node scripts/data-refresh.js

      # 步骤5: 检查是否有变化
      - name: Check for changes
        id: changes
        run: |
          if git status --porcelain | grep -q .; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      # 步骤6: Commit 并 Push（仅当有变化时）
      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true' || github.event.inputs.force_deploy == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "chore: auto-refresh data $(date '+%Y-%m-%d %H:%M')" || true
          git push origin main
        env:
          # 使用 GITHUB_TOKEN 进行认证
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 步骤7: 输出结果
      - name: Summary
        run: |
          echo "## 数据刷新结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**执行时间**: $(date '+%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.changes.outputs.has_changes }}" == "true" ]; then
            echo "**状态**: ✅ 检测到数据变化，已提交并推送" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            git diff --cached --stat >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Vercel 将自动检测到 push 并开始部署。" >> $GITHUB_STEP_SUMMARY
          else
            echo "**状态**: ℹ️ 无数据变化，跳过部署" >> $GITHUB_STEP_SUMMARY
          fi

  # 独立的部署检查（可选）
  # 由于 Vercel 会自动检测 git push 并部署，这里不需要额外的部署步骤
